apiVersion: v1
kind: Namespace
metadata:
  name: mumnk8s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust-deploy
  namespace: mumnk8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      containers:
        - name: api-rust
          image: puppy-imaging-props.ngrok-free.dev/api-rust:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust-service
  namespace: mumnk8s
spec:
  selector:
    app: api-rust
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
